<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#17120e}
  @keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:.85}}
  ::selection{background:rgba(224,168,46,.3)}
</style>
</helmet>
<div style="--accent:{{ accentVar }}; --glow:{{ glowVar }}; min-height:100vh; background:radial-gradient(120% 60% at 50% -5%, #271c12 0%, #1a130d 50%, #15100b 100%); color:#f3e9d2; font-family:'Cormorant Garamond',serif; position:relative; overflow:hidden; display:flex; flex-direction:column;">

  <sc-if value="{{ glow }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute; top:-180px; left:50%; transform:translateX(-50%); width:700px; height:600px; background:radial-gradient(circle, var(--glow,rgba(224,168,46,0.45)) 0%, transparent 64%); filter:blur(28px); animation:glowPulse 6s ease-in-out infinite; pointer-events:none; z-index:0;"></div>
  </sc-if>

  <header style="position:relative; z-index:2; display:flex; align-items:center; padding:18px 32px; border-bottom:1px solid rgba(224,168,46,0.14);">
    <a href="The%20Procession.dc.html" style="display:flex; align-items:center; gap:11px; text-decoration:none; border-radius:2px;" style-focus="outline:2px solid var(--accent,#E0A82E); outline-offset:4px;">
      <img src="the-holy-tube.svg" width="28" height="28" alt="" style="display:block;" />
      <span style="display:flex; flex-direction:column; gap:3px;">
        <span style="font:600 14px/1 'Cinzel',serif; letter-spacing:3px; color:#f3e9d2; white-space:nowrap;">SNACKTUM SNACKTORUM</span>
        <span style="font:400 9.5px/1 'Cinzel',serif; letter-spacing:3px; color:var(--accent,#E0A82E); white-space:nowrap;">ORDER OF THE HOLY TUBE</span>
      </span>
    </a>
  </header>

  <main style="position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; max-width:560px; margin:0 auto; padding:48px 24px 72px; text-align:center;">

    <div style="position:relative; display:flex; align-items:center; justify-content:center; flex:none; opacity:0.92;">
      <svg viewBox="0 0 200 200" width="140" height="140" fill="none" stroke="var(--accent,#E0A82E)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <g stroke-width="2.5" opacity="0.9"><line x1="100" y1="30" x2="100" y2="12"></line><line x1="74" y1="36" x2="64" y2="20"></line><line x1="126" y1="36" x2="136" y2="20"></line><line x1="52" y1="50" x2="38" y2="38"></line><line x1="148" y1="50" x2="162" y2="38"></line><line x1="40" y1="70" x2="24" y2="66"></line><line x1="160" y1="70" x2="176" y2="66"></line></g>
        <ellipse cx="100" cy="58" rx="42" ry="11"></ellipse>
        <rect x="52" y="98" width="96" height="26" rx="13" fill="rgba(224,168,46,0.16)"></rect>
        <path d="M66 110 q8 -7 16 0 q8 7 16 0 q8 -7 16 0 q8 7 16 0" stroke-width="2.6"></path>
        <path d="M44 122 q0 -4 6 -4 h100 q6 0 6 4 v6 q0 18 -22 18 h-68 q-22 0 -22 -18 z" fill="rgba(224,168,46,0.06)"></path>
      </svg>
    </div>

    <span style="font:600 12px/1 'Cinzel',serif; letter-spacing:5px; text-transform:uppercase; color:var(--accent,#E0A82E);">{{ eyebrow }}</span>
    <div style="font:700 clamp(72px,16vw,128px)/0.9 'Cinzel',serif; letter-spacing:2px; color:#f6ecd2; text-shadow:0 4px 40px rgba(224,168,46,0.22); margin:4px 0;">{{ status }}</div>
    <p style="font:400 21px/1.55 'Cormorant Garamond',serif; color:rgba(243,233,210,0.78); max-width:460px; margin:0; text-wrap:pretty;">{{ line }}</p>

    <a href="The%20Procession.dc.html" style="display:inline-flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; padding:16px 40px; background:var(--accent,#E0A82E); color:#17120e; border:none; border-radius:2px; font:600 14px/1 'Cinzel',serif; letter-spacing:2px; text-transform:uppercase; text-decoration:none; cursor:pointer; box-shadow:0 8px 28px rgba(224,168,46,0.24);" style-hover="filter:brightness(1.08);" style-focus="outline:2px solid #f3e9d2; outline-offset:3px;">Return to the Procession →</a>

  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Mustard Gold&quot;,&quot;Relic Crimson&quot;,&quot;Verdigris&quot;],&quot;default&quot;:&quot;Mustard Gold&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Not Found (404)&quot;,&quot;Disturbance (500)&quot;],&quot;default&quot;:&quot;Not Found (404)&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const acc = this.props.accent || 'Mustard Gold';
    const PAL = {
      'Mustard Gold':  ['#E0A82E', 'rgba(224,168,46,0.45)'],
      'Relic Crimson': ['#cf4636', 'rgba(207,70,54,0.45)'],
      'Verdigris':     ['#57b59a', 'rgba(87,181,154,0.45)']
    };
    const [accentVar, glowVar] = PAL[acc] || PAL['Mustard Gold'];
    const mode = this.props.mode || 'Not Found (404)';
    const notFound = mode.indexOf('404') >= 0;
    return {
      accentVar, glowVar,
      glow: this.props.glow !== false,
      eyebrow: notFound ? 'Thou Hast Strayed' : 'A Disturbance in the Tube',
      status: notFound ? '404' : '500',
      line: notFound
        ? 'This corridor of the Snacktum leads nowhere, pilgrim. The link thou sought is not among the sacred.'
        : 'A disturbance in the Tube — the Order is set upon it. Tarry a moment, then seek the gates anew.'
    };
  }
}
</script>
</body>
</html>
