name: Supabase keep-alive

# Supabase free-tier projects auto-pause after 7 days with no DB activity.
# This workflow issues a tiny daily read against the REST API to keep the
# project active. The Top Dog daily tally and mustard prune jobs are added
# here in M2/M4 once their RPC functions exist.

on:
  schedule:
    - cron: '17 7 * * *' # daily at 07:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keeps DB active)
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
