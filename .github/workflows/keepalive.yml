name: Supabase keep-alive

# Supabase free-tier projects auto-pause after 7 days with no DB activity.
# This workflow issues a tiny daily read against the REST API to keep the
# project active, then runs the Top Dog daily tally (M2) and the mustard prune
# job (M4 — deletes fully-faded sprays older than 24h).

on:
  schedule:
    - cron: '17 7 * * *' # daily at 07:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keeps DB active)
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Tally Top Dog day (idempotent)
        # Records today for the current Top Dog and recomputes days_as_top_dog.
        # The RPC takes no input and is idempotent (ON CONFLICT DO NOTHING), so a
        # daily call — even one that runs after an earlier same-day dispatch — is
        # safe. Anon (publishable) key is sufficient: tally_top_dog_day() is
        # granted to anon and only ever records the actual current crown-holder.
        # Fail the step on a non-2xx so a broken tally turns the workflow red.
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/tally_top_dog_day" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "tally_top_dog_day HTTP ${code}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::tally_top_dog_day returned non-2xx (${code})"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Prune mustard sprays (>24h, idempotent)
        # Deletes fully-faded mustard sprays (sprayed_at older than 24h), bounding
        # mustard_sprays growth (adversarial finding C). The RPC takes no input and
        # is idempotent (it only ever deletes provably-expired, opacity-0 rows), so
        # a daily call — even one after an earlier same-day dispatch — is safe and
        # self-limiting. Anon (publishable) key is sufficient: prune_mustard_sprays()
        # is granted to anon and is not forgeable (decision #26). Fail the step on a
        # non-2xx so a broken prune turns the workflow red.
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/prune_mustard_sprays" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "prune_mustard_sprays HTTP ${code}"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::prune_mustard_sprays returned non-2xx (${code})"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
